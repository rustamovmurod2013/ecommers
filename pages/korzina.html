<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <header class="fixed bg-[white] w-full top-0 z-3">
        <div class="container mx-auto flex justify-between items-center py-[16px]">
            <a href="../index.html" class="block">
                <img src="../images/logo (3).png" alt="Логотип">
            </a>
            <div class="flex gap-[16px] items-center">
                <div class="bg-[green] flex items-center gap-[5px] py-[6px] px-[5px] rounded-[4px]">
                    <a class="text-[20px] font-bold text-[white]" href="../category.html">Каталог</a>
                    <button id="drop-down-category"
                        class="text-[20px] text-[white] font-[400] bg-[#70C05B] py-[8px] px-[30px] rounded-[4px] mx-[16px] cursor-pointer hover:bg-[#5da04c] transition-colors"><img
                            src="../assets/menu.svg" alt=""></button>
    
                </div>
                <input class="px-[20px] py-[8px] rounded-[4px] border border-[#70C05B] outline-none focus:border-[#5da04c]"
                    placeholder="Найти товар" type="text">
            </div>
            <div class="flex gap-[24px] items-center">
                <a href="#" class="relative hover:opacity-80 transition-opacity flex flex-col items-center">
                    <div>
                        <img width="30" height="30" src="https://www.svgrepo.com/show/428150/heart.svg" alt="Избранное">
                    </div>
                    <p class="text-[12px] font-[500]">Избранное</p>
                </a>
                <a href="#" class="relative hover:opacity-80 transition-opacity flex flex-col items-center">
                    <div>
                        <img width="30" height="30" src="https://cdn-icons-png.flaticon.com/512/679/679720.png" alt="Заказы">
                    </div>
                    <p class="text-[12px] font-[500]">Продукты</p>
                </a>
                <a href="" class="relative hover:opacity-80 transition-opacity flex flex-col items-center">
                    <div>
                        <img width="30" height="30" src="https://www.svgrepo.com/show/314613/shopping-cart-solid.svg" alt="Корзина">
                        <span id="badge"
                            class="absolute -top-2 -right-2 bg-[#FF6633] text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
                    </div>
                    <p>Корзина</p>
                </a>
                <a href="#" class="hover:opacity-80 transition-opacity">
                    <img src="../images/UserMenuItem.png" alt="Профиль">
                </a>
            </div>
        </div>
    </header>

    <div id="res-menu" class="bg-[white] translate-y-[-100%] pt-20 fixed top-0 w-full duration-500 z-2">
        <div id="category" class="container mx-auto grid grid-cols-3 p-5 border-b-[2px] border-b-[grey]">
    
        </div>
    </div>

    <main class="pt-20">
        <section>
            <div id="korzinaProducts" class="container mx-auto p-5">

            </div>
        </section>
    </main>
    <script src="../js/products-data/products-data.js"></script>    
    <script src="../js/categories-data.js"></script>    
    <script src="../js/main.js"></script>
</body>
</html>
